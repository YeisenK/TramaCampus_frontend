server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Flutter web is a single-page app — every unknown path falls back
  # to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Aggressive caching for the immutable build outputs Flutter ships
  # under main.dart.js / canvaskit / assets. index.html stays
  # uncached so a new deploy is picked up on next visit.
  location ~* \.(?:js|wasm|json|woff2?|ttf|otf|png|jpg|jpeg|svg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # gzip everything text-y.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_vary on;
}
